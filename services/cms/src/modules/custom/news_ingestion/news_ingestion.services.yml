services:
  news_ingestion.source_locator:
    class: Drupal\news_ingestion\Source\NewsSourceLocator
    arguments: [!tagged_iterator news_ingestion.source]

  news_ingestion.language_mapper:
    class: Drupal\news_ingestion\Mapper\LanguageMapper
    arguments: ['@entity_type.manager']

  news_ingestion.country_mapper:
    class: Drupal\news_ingestion\Mapper\CountryMapper
    arguments: ['@entity_type.manager']

  news_ingestion.region_mapper:
    class: Drupal\news_ingestion\Mapper\RegionMapper
    arguments:
      - '@entity_type.manager'
      - '%app.root%/data/geo/UNESCO-world-regions-sdg.csv'

  news_ingestion.media_downloader:
    class: Drupal\news_ingestion\Service\RemoteImageMediaDownloader
    arguments:
      - '@http_client'
      - '@file_system'
      - '@file.repository'
      - '@logger.factory'

  news_ingestion.source_prerequisites:
    class: Drupal\news_ingestion\Service\SourcePrerequisiteService
    arguments:
      - '@entity_type.manager'
      - '@entity.repository'
      - '@password_generator'
      - '@file_system'
      - '@file.repository'
      - '@extension.list.module'

  news_ingestion.upsert:
    class: Drupal\news_ingestion\Service\NewsUpsertService
    arguments:
      - '@entity_type.manager'
      - '@news_ingestion.language_mapper'
      - '@news_ingestion.country_mapper'
      - '@news_ingestion.region_mapper'
      - '@news_ingestion.media_downloader'
      - '@news_ingestion.source_prerequisites'
      - '@datetime.time'

  news_ingestion.runner:
    class: Drupal\news_ingestion\Service\NewsIngestRunner
    arguments:
      - '@news_ingestion.source_locator'
      - '@news_ingestion.upsert'
      - '@news_ingestion.source_prerequisites'
      - '@entity_type.manager'
      - '@logger.factory'

  news_ingestion.cron_scheduler:
    class: Drupal\news_ingestion\Service\NewsCronScheduler
    arguments:
      - '@news_ingestion.source_locator'
      - '@queue'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@logger.factory'

  news_ingestion.near_dupe_cleanup:
    class: Drupal\news_ingestion\Service\NearDupeCleanupService
    arguments:
      - '@entity_type.manager'
      - '@news_ingestion.source_prerequisites'
      - '@logger.factory'
